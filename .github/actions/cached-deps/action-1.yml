name: 'get and cache dependencies'
description: 'Get and cache project npm dependencies'
runs: 
  using: 'composite'
  steps:
    - name: Cache dependencies
      id: cache
      uses: actions/cache@v3
      with: 
        path: action-reaction-project/node_modules
        key: ${{ hashFiles('**/package-lock.json') }}

    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      run: npm ci
      working-directory: action-reaction-project
      shell: bash
