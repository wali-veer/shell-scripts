name: Deployment
on:
  push:
    branches:
      - main
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
                
      - name: Load & Cache dependencies
        uses: ./.github/actions/cached-deps

      - name: Lint code
        run: npm run lint
        working-directory: action-reaction-project

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Load & Cache dependencies
        uses: ./.github/actions/cached-deps

      - name: Test code
        id: run-tests
        run: npm run test
        working-directory: action-reaction-project

      - name: Upload test report
        if: failure() && steps.run-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test.json

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Load & Cache dependencies
        uses: ./.github/actions/cached-deps

      - name: Build website
        run: npm run build
        working-directory: action-reaction-project

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: action-reaction-project/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Get build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: action-reaction-project/dist

      - name: Output contents
        run: ls
        shell: bash
      - name: Deploy site
        run: echo "Deploying..."