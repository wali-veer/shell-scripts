name: reusable deploy
on: 
    workflow_call:
        inputs:
            artifact-name:
                description: 'Name of the artifact to be deployed'
                required: false
                default: dist
                type: string
        
        outputs:
            result:
                description: 'Outcome of the deployment step'
                value: ${{ jobs.deploy.outputs.outcome }}        

#        secrets:
#            DEPLOYMENT_KEY:
#                description: 'Deployment key for secure access'
#                required: true
jobs:
    deploy:
        outputs:
            outcome: ${{ steps.set-output.outputs.step-result }}
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/download-artifact@v4
              with:
                name: ${{ inputs.artifact-name }}

            - name: List files in artifact
              run: ls -R 

            - name: Output Information
              run: echo "Deploying and uploading artifacts..."

            - name: Set the output of the results
              id: set-output
              run: echo "step-result=SUCCESS" >> $GITHUB_OUTPUT