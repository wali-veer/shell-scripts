name: reusable deploy
on: 
    workflow_call:
        inputs:
            artifact-name:
                description: 'Name of the artifact to be deployed'
                required: false
                default: dist
                type: string
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/download-artifact@v4
              with:
                name: ${{ inputs.artifact-name }}

            - name: List files in artifact
              run: ls -R 

            - name: Output Information
              run: echo "Deploying and uploading artifacts..."