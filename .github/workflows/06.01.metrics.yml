name: matrix
on: 
#  push:
 #   branches:
  #      - main
  workflow_dispatch:
jobs:
    build:
        continue-on-error: true  # to avoid failing the entire workflow if one of the matrix jobs fails
        strategy:
            matrix:
                node-version: [16, 18, 20]
                operating-system: [ubuntu-latest, windows-latest, macos-latest]
                include:
                    - node-version: 14
                      operating-system: macos-latest
                exclude:
                    - node-version: 18
                      operating-system: macos-latest
        runs-on: ${{ matrix.operating-system }}
        steps:
            - name: Get Code
              uses: actions/checkout@v4
            
            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                node-version: ${{ matrix.node-version }}
        
            - name: Install dependencies
              run: npm ci
              working-directory: action-reaction-project

            - name: Run Build
              run: npm run build
              working-directory: action-reaction-project