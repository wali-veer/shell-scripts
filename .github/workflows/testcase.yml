name: Testing this project
on: push
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Download the code
              uses: actions/checkout@v3
            - name: Install nodeJS
              uses: actions/setup-node@v3
              with:
                  node-version: 18
            - name: Install dependencies
              run: npm ci
            - name: Run tests
              run: npm test
              