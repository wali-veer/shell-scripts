name: Deployment
on:
  workflow_dispatch:
  #push:
  #  branches:
  #    - main
  #    - dev
env:
  MONGODB_DB_NAME: gitHubAction-test-demo
jobs:
  test:
    env:
      MONGODB_CLUSTER_ADDRESS: <YOUR_MONGODB_CLUSTER_ADDRESS>
      MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
      MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
      PORT: 8080
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-deps-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci
      
      - name: Run server
        run: npm start & npx wait-on http://127.0.0.1:$PORT
      
      - name: Run tests
        run: npm test
      
      - name: Output information
        run: |        
          echo "MONGODB_USERNAME : ${{ env.MONGODB_USERNAME }}"  #Secrets cannot be printed in the logs, so this will print nothing.
          echo "MONGODB_PASSWORD : ${{ env.MONGODB_PASSWORD }}"
          echo "MONGODB_CLUSTER_ADDRESS : ${{ env.MONGODB_CLUSTER_ADDRESS }}"
  
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Output information
        run: |        
          echo "MONGODB_DB_NAME : ${{ env.MONGODB_DB_NAME }}"